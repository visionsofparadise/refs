[package]
name = "refs"
version = "0.1.1"
authors = ["Matt Cavender"]
description = "List file references and repair them from declared moves"
license = "MIT"
repository = "https://github.com/visionsofparadise/refs"
publish = false
edition = "2021"
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["derive"] }
dunce = "1"
ignore = "0.4"
percent-encoding = "2"
same-file = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints.rust]
nonstandard_style = "deny"

[profile.dev]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.packager]
product-name = "refs"
identifier = "com.visionsofparadise.refs"
publisher = "Matt Cavender"
icons = ["packaging/icon.png"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
template = "packaging/installer.nsi"

[package.metadata.packager.appimage]
files = { "target/x86_64-unknown-linux-musl/release/refs" = "usr/share/refs/refs" }
